name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 mancante: APK firmato con chiave di debug, gli aggiornamenti non si installeranno sopra la versione precedente."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=ordinafacile
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - name: Build APK
        # Solo telefoni ARM (tutti quelli reali): senza x86_64 l'APK resta sotto il limite di 50 MB di Supabase Storage.
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-name=1.0.0 --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v5
        with:
          name: OrdinaFacile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish update for the in-app notice
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: https://stknnostvolacmuyvydk.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::warning::Secret SUPABASE_SECRET_KEY mancante: l'APK non viene pubblicato per l'avviso di aggiornamento."
            exit 0
          fi
          auth=(-H "apikey: $SUPABASE_SECRET_KEY")
          # Le chiavi legacy (JWT) vanno anche nell'header Authorization, le nuove sb_secret_ no.
          case "$SUPABASE_SECRET_KEY" in sb_*) ;; *) auth+=(-H "Authorization: Bearer $SUPABASE_SECRET_KEY") ;; esac
          apk="OrdinaFacile-$BUILD.apk"
          ls -l build/app/outputs/flutter-apk/app-release.apk
          curl -sSf -X POST "$SUPABASE_URL/storage/v1/object/app/$apk" "${auth[@]}" \
            -H "x-upsert: true" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @build/app/outputs/flutter-apk/app-release.apk
          printf '{"build": %s, "name": "1.0.0 (%s)", "url": "%s/storage/v1/object/public/app/%s"}' \
            "$BUILD" "$BUILD" "$SUPABASE_URL" "$apk" > version.json
          curl -sSf -X POST "$SUPABASE_URL/storage/v1/object/app/version.json" "${auth[@]}" \
            -H "x-upsert: true" -H "Content-Type: application/json" -H "cache-control: max-age=60" \
            --data-binary @version.json
          # Tiene su Supabase solo l'ultimo APK, per non riempire lo spazio gratuito (1 GB).
          old=$(curl -sSf -X POST "$SUPABASE_URL/storage/v1/object/list/app" "${auth[@]}" \
            -H "Content-Type: application/json" -d '{"prefix": "", "limit": 1000}' \
            | jq -c --arg keep "$apk" '[.[].name | select(endswith(".apk") and . != $keep)]')
          if [ "$old" != "[]" ]; then
            curl -sSf -X DELETE "$SUPABASE_URL/storage/v1/object/app" "${auth[@]}" \
              -H "Content-Type: application/json" -d "{\"prefixes\": $old}"
          fi
