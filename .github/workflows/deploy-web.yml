name: Versione web

# Versione web (per iPhone e PC): stessa app, stesso database.
# Su main viene pubblicata sul ramo gh-pages, che Cloudflare Pages mette online
# (GitHub Pages gratuito non funziona con un progetto privato).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Cloudflare serve il sito dalla radice (xxx.pages.dev/ e poi il sottodominio Dofrelli).
  WEB_BASE_HREF: /

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # CanvasKit servito dal nostro indirizzo, non dal CDN di Google.
      - run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run --base-href "$WEB_BASE_HREF"
      - name: Pubblica sul ramo gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
          commit_message: Versione web
